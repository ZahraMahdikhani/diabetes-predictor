<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تشخیص احتمال دیابت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Vazir, Tahoma, sans-serif; background: #f6f8fa; }
        .container { max-width: 900px; margin: auto; padding: 25px; }
        .form-text { font-size: 0.85rem; color: #555; }
        .result-box { padding: 15px; border-radius: 8px; font-size: 18px; text-align: center; margin-top: 15px; }
        .positive { background: #ffebee; color: #c62828; }
        .negative { background: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>
<div class="container">
    <h2 class="text-center mb-4">تشخیص احتمال دیابت</h2>
    <form method="post" class="row g-3">

        <!-- BMI -->
        <div class="col-md-6">
            <label class="form-label">BMI</label>
            <input type="number" name="BMI" step="0.1" min="10" max="60" class="form-control" required>
            <div class="form-text">عدد BMI خود را وارد کنید (بین 10 تا 60)</div>
        </div>

        <!-- HighBP -->
        <div class="col-md-6">
            <label class="form-label">فشار خون بالا (HighBP)</label>
            <select class="form-select" name="HighBP" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
            <div class="form-text">0 = خیر، 1 = بله</div>
        </div>

        <!-- HighChol -->
        <div class="col-md-6">
            <label class="form-label">کلسترول بالا (HighChol)</label>
            <select class="form-select" name="HighChol" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- CholCheck -->
        <div class="col-md-6">
            <label class="form-label">چکاپ کلسترول (CholCheck)</label>
            <select class="form-select" name="CholCheck" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- Smoker -->
        <div class="col-md-6">
            <label class="form-label">سیگاری بودن (Smoker)</label>
            <select class="form-select" name="Smoker" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- Stroke -->
        <div class="col-md-6">
            <label class="form-label">سابقه سکته (Stroke)</label>
            <select class="form-select" name="Stroke" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- HeartDiseaseorAttack -->
        <div class="col-md-6">
            <label class="form-label">سابقه حمله قلبی (HeartDiseaseorAttack)</label>
            <select class="form-select" name="HeartDiseaseorAttack" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- PhysActivity -->
        <div class="col-md-6">
            <label class="form-label">فعالیت فیزیکی (PhysActivity)</label>
            <select class="form-select" name="PhysActivity" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- Fruits -->
        <div class="col-md-6">
            <label class="form-label">مصرف میوه (Fruits)</label>
            <select class="form-select" name="Fruits" required>
                <option value="0">عدم مصرف روزانه</option>
                <option value="1">مصرف روزانه</option>
            </select>
        </div>

        <!-- Veggies -->
        <div class="col-md-6">
            <label class="form-label">مصرف سبزیجات (Veggies)</label>
            <select class="form-select" name="Veggies" required>
                <option value="0">عدم مصرف روزانه</option>
                <option value="1">مصرف روزانه</option>
            </select>
        </div>

        <!-- HvyAlcoholConsump -->
        <div class="col-md-6">
            <label class="form-label">مصرف زیاد الکل (HvyAlcoholConsump)</label>
            <select class="form-select" name="HvyAlcoholConsump" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- AnyHealthcare -->
        <div class="col-md-6">
            <label class="form-label">دسترسی به خدمات درمانی (AnyHealthcare)</label>
            <select class="form-select" name="AnyHealthcare" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- NoDocbcCost -->
        <div class="col-md-6">
            <label class="form-label">مشکل پرداخت هزینه پزشک (NoDocbcCost)</label>
            <select class="form-select" name="NoDocbcCost" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- DiffWalk -->
        <div class="col-md-6">
            <label class="form-label">مشکل در راه رفتن (DiffWalk)</label>
            <select class="form-select" name="DiffWalk" required>
                <option value="0">خیر</option>
                <option value="1">بله</option>
            </select>
        </div>

        <!-- Gender -->
        <div class="col-md-6">
            <label class="form-label">جنسیت (Gender)</label>
            <select class="form-select" name="Gender" required>
                <option value="0">زن</option>
                <option value="1">مرد</option>
            </select>
        </div>

        <!-- GenHlth -->
        <div class="col-md-6">
            <label class="form-label">وضعیت سلامتی عمومی (GenHlth)</label>
            <select class="form-select" name="GenHlth" required>
                <option value="1">1: عالی</option>
                <option value="2">2: خیلی خوب</option>
                <option value="3">3: خوب</option>
                <option value="4">4: متوسط</option>
                <option value="5">5: ضعیف</option>
            </select>
        </div>

        <!-- MentHlth -->
        <div class="col-md-6">
            <label class="form-label">روزهای مشکلات روحی در 30 روز اخیر (MentHlth)</label>
            <input type="number" class="form-control" name="MentHlth" min="0" max="30" required>
        </div>

        <!-- PhysHlth -->
        <div class="col-md-6">
            <label class="form-label">روزهای مشکلات جسمی در 30 روز اخیر (PhysHlth)</label>
            <input type="number" class="form-control" name="PhysHlth" min="0" max="30" required>
        </div>

        <!-- Age -->
        <div class="col-md-6">
            <label class="form-label">سن (Age)</label>
            <select class="form-select" name="Age" required>
                <option value="1">1: 18–24</option>
                <option value="2">2: 25–29</option>
                <option value="3">3: 30–34</option>
                <option value="4">4: 35–39</option>
                <option value="5">5: 40–44</option>
                <option value="6">6: 45–49</option>
                <option value="7">7: 50–54</option>
                <option value="8">8: 55–59</option>
                <option value="9">9: 60–64</option>
                <option value="10">10: 65–69</option>
                <option value="11">11: 70–74</option>
                <option value="12">12: 75+</option>
            </select>
        </div>

        <!-- Education -->
        <div class="col-md-6">
            <label class="form-label">سطح تحصیلات (Education)</label>
            <select class="form-select" name="Education" required>
                <option value="1">1: زیر دیپلم</option>
                <option value="2">2: دیپلم</option>
                <option value="3">3: برخی دوره دانشگاهی</option>
                <option value="4">4: کاردانی</option>
                <option value="5">5: کارشناسی</option>
                <option value="6">6: کارشناسی ارشد / دکتری</option>
            </select>
        </div>

        <!-- Income -->
        <div class="col-md-6">
            <label class="form-label">سطح درآمد (Income)</label>
            <select class="form-select" name="Income" required>
                <option value="1">1: کمتر از $10k</option>
                <option value="2">2: $10–15k</option>
                <option value="3">3: $15–20k</option>
                <option value="4">4: $20–25k</option>
                <option value="5">5: $25–35k</option>
                <option value="6">6: $35–50k</option>
                <option value="7">7: $50–75k</option>
                <option value="8">8: $75k+</option>
            </select>
        </div>

        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary w-100">محاسبه احتمال دیابت</button>
        </div>

    </form>

    {% if prediction %}
        <div class="result-box {{ 'positive' if prediction.result==1 else 'negative' }}">
            <strong>
                {% if prediction.result == 1 %}
                    احتمال بالای دیابت تشخیص داده شد.
                {% else %}
                    نشانه‌ای از دیابت دیده نشد.
                {% endif %}
            </strong>
            <br>
            احتمال مدل: {{ prediction.prob }}
            <br>
            <a href="{{ url_for('download_pdf', rec_id=prediction.id) }}" class="btn btn-outline-secondary btn-sm mt-2">دانلود PDF نتیجه</a>
        </div>
    {% endif %}

</div>
</body>
</html>
