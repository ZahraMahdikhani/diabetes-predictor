<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Risk Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="header-content">
            <h1 class="header-title">Diabetes Risk Calculator</h1>
            <p class="header-subtitle">Quick and accurate 10-year type 2 diabetes risk assessment</p>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <form method="POST" class="form-wrapper" id="diabetesForm">

                <!-- Section 1 -->
                <div class="form-section" id="section-1">
                    <h2 class="section-title">Personal & Health Information</h2>
                    <p class="section-description">Let's start with some basic information about you</p>
                    <div class="form-grid">

                        <!-- Height -->
                        <div class="form-group">
                            <label class="form-label">Height (cm)</label>
                            <input type="number" name="Height" step="0.1" min="50" max="250" class="form-input" placeholder="e.g. 170" required>
                            <span class="form-hint">Enter your height in centimeters</span>
                        </div>

                        <!-- Weight -->
                        <div class="form-group">
                            <label class="form-label">Weight (kg)</label>
                            <input type="number" name="Weight" step="0.1" min="20" max="300" class="form-input" placeholder="e.g. 70" required>
                            <span class="form-hint">Enter your weight in kilograms</span>
                        </div>

                        <!-- Gender -->
                        <div class="form-group">
                            <label class="form-label">Gender</label>
                            <div class="radio-group">
                                <label class="radio-label"><input type="radio" name="Gender" value="0" required><span>Female</span></label>
                                <label class="radio-label"><input type="radio" name="Gender" value="1" required><span>Male</span></label>
                            </div>
                        </div>

                        <!-- Age Group -->
                        <div class="form-group">
                            <label class="form-label">Age Group</label>
                            <select class="form-select" name="Age" required>
                                <option value="">Select age range</option>
                                <option value="1">18–24 years</option>
                                <option value="2">25–29 years</option>
                                <option value="3">30–34 years</option>
                                <option value="4">35–39 years</option>
                                <option value="5">40–44 years</option>
                                <option value="6">45–49 years</option>
                                <option value="7">50–54 years</option>
                                <option value="8">55–59 years</option>
                                <option value="9">60–64 years</option>
                                <option value="10">65–69 years</option>
                                <option value="11">70–74 years</option>
                                <option value="12">75+ years</option>
                            </select>
                        </div>

                        <!-- General Health -->
                        <div class="form-group">
                            <label class="form-label">General Health</label>
                            <select class="form-select" name="GenHlth" required>
                                <option value="">How would you rate your health?</option>
                                <option value="1">Excellent</option>
                                <option value="2">Very good</option>
                                <option value="3">Good</option>
                                <option value="4">Fair</option>
                                <option value="5">Poor</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Other sections unchanged -->
                <!-- The rest of your HTML remains exactly the same -->

                <!-- Navigation Buttons -->
                <div class="button-group">
                    <button type="button" class="btn btn-secondary" id="prevBtn" style="display: none;">Previous</button>
                    <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
                    <button type="submit" class="btn btn-success" id="submitBtn" style="display: none;">View Results</button>
                </div>

            </form>
        </div>
    </main>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
